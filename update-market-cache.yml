name: Refresh fund data and publish Pages snapshot

on:
  # Poll after the NAV provider's 18:00 Asia/Taipei publication window.
  # The updater commits only when NAV or distribution data actually changes.
  schedule:
    - cron: '*/10 10-12 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch latest NAV and distributions
        run: node scripts/update-market-cache.js

      - name: Commit updated snapshot
        id: commit
        shell: bash
        run: |
          if git diff --quiet -- northstar-market-cache.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No market data changes to publish."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add northstar-market-cache.json
          git commit -m "Refresh fund NAV and distribution snapshot"
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: refresh
    if: needs.refresh.outputs.changed == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out updated main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy static site
        id: deployment
        uses: actions/deploy-pages@v5
